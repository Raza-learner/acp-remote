name = "runmote-scripts"
main = "worker.js"
compatibility_date = "2026-07-10"

routes = [
  { pattern = "runmote.dev/install*", zone_name = "runmote.dev" },
  { pattern = "runmote.dev/install.ps1*", zone_name = "runmote.dev" }
]

# Keep Render free-tier relays awake (sleep after 15 min inactivity)
[triggers]
crons = ["*/13 * * * *"]
