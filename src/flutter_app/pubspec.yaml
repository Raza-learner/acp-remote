name: acp_remote
description: "Runmote - Connect to ACP AI agents via pairing code"
publish_to: 'none'
version: 1.0.2+269

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  web_socket_channel: ^3.0.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.0
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  multicast_dns: ^0.3.3+1
  file_picker: 12.0.0-beta.7
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flex_color_scheme: ^8.4.0
  permission_handler: ^11.4.0
  mobile_scanner: ^7.4.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/logos/app_icon.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#FAEFE2"
  adaptive_icon_foreground: "assets/logos/app_icon_foreground.png"
  ios: true
  web:
    generate: true
    image_path: "assets/logos/app_icon.png"
    background_color: "#FAEFE2"
    theme_color: "#FAEFE2"
  windows:
    generate: true
    image_path: "assets/logos/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logos/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logos/
    - .env

